<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트CD PM</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--sunk:#efede8;--line:#e2dfd8;--line2:#d3cfc6;
  --ink:#1d1c1a;--ink2:#55524c;--ink3:#8a867d;
  --acc:#2f5bd3;--acc-soft:#e6ecfb;
  --ok:#1f8a5b;--ok-soft:#e2f3ea;--warn:#b7791f;--warn-soft:#fbf0dc;--bad:#c2413a;--bad-soft:#fbe5e3;--doing:#6d4bd1;--doing-soft:#eee8fb;
  --r:10px;--shadow:0 1px 0 rgba(0,0,0,.03),0 1px 3px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1d1c1b;--sunk:#252422;--line:#2f2d2a;--line2:#3c3a36;
  --ink:#eeebe5;--ink2:#b3aea4;--ink3:#7f7a71;
  --acc:#7d9cf5;--acc-soft:#232c46;
  --ok:#5cc596;--ok-soft:#1b3328;--warn:#e0a84c;--warn-soft:#382c17;--bad:#ef7d75;--bad-soft:#3d2120;--doing:#a991f2;--doing-soft:#2b2442;
  --shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1d1c1b;--sunk:#252422;--line:#2f2d2a;--line2:#3c3a36;
  --ink:#eeebe5;--ink2:#b3aea4;--ink3:#7f7a71;
  --acc:#7d9cf5;--acc-soft:#232c46;
  --ok:#5cc596;--ok-soft:#1b3328;--warn:#e0a84c;--warn-soft:#382c17;--bad:#ef7d75;--bad-soft:#3d2120;--doing:#a991f2;--doing-soft:#2b2442;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-feature-settings:"tnum"}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{font:12.5px/1.4 ui-monospace,Consolas,monospace;background:var(--sunk);padding:1px 5px;border-radius:4px;word-break:break-all}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:750;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--acc)}
.meta{margin-left:auto;color:var(--ink3);font-size:12px;display:flex;gap:12px;align-items:center}
.meta button{border:1px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:7px;padding:3px 8px;font:inherit;cursor:pointer}
nav.tabs{max-width:1320px;margin:0 auto;padding:6px 14px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:8px 11px 9px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:550;font-size:13.5px}
nav.tabs a:hover{color:var(--ink);text-decoration:none}
nav.tabs a.on{color:var(--ink);border-color:var(--acc)}
nav.tabs a .n{font-size:11px;color:var(--ink3);margin-left:4px;font-weight:500}
main{max-width:1320px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--ink2);margin:0 0 18px;max-width:80ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{color:var(--ink3);font-size:12px}.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.3}.kpi .s{color:var(--ink2);font-size:12px}
.prog{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-top:6px}.prog>i{display:block;height:100%;background:var(--acc);border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap;line-height:1.7}
.c-done{background:var(--ok-soft);color:var(--ok)}.c-doing{background:var(--doing-soft);color:var(--doing)}.c-wait{background:var(--warn-soft);color:var(--warn)}.c-todo{background:var(--sunk);color:var(--ink2)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-acc{background:var(--acc-soft);color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink3)}.dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:7px 0;border-top:1px solid var(--line)}ul.plain li:first-child{border-top:0}
.row{display:flex;gap:8px;align-items:baseline}.row .grow{flex:1;min-width:0}
.muted{color:var(--ink3)}.small{font-size:12px}
.risk-high{border-left:3px solid var(--bad);padding-left:10px}.risk-mid{border-left:3px solid var(--warn);padding-left:10px}.risk-low{border-left:3px solid var(--line2);padding-left:10px}
/* 칸반 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink)}
.filters label{font-size:12.5px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;align-items:start;overflow-x:auto}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:120px}
.col h3{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px 8px;margin:0}
.k{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow)}
.k .t{font-weight:560;font-size:13.5px;line-height:1.45}
.k .m{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.k .w{font-size:11.5px;color:var(--ink3);margin-top:5px}
.more{width:100%;font:inherit;font-size:12.5px;padding:6px;border:1px dashed var(--line2);background:none;border-radius:8px;color:var(--ink2);cursor:pointer}
/* 표 */
.tw{overflow-x:auto;margin:8px 0 14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--sunk);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 문서 */
.doclay{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.toc{position:sticky;top:110px;display:flex;flex-direction:column;gap:2px}
.toc a{padding:7px 10px;border-radius:7px;color:var(--ink2);font-size:13px}.toc a.on{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.prose{max-width:860px}
.prose h2{font-size:15.5px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.prose h2:first-child{border-top:0;margin-top:0;padding-top:0}
.prose h3,.prose h4{font-size:14px;margin:16px 0 6px}
.prose p,.prose li{color:var(--ink)}
.prose ul,.prose ol{padding-left:20px;margin:6px 0}
.prose blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line2);color:var(--ink2)}
.prose pre{background:var(--sunk);padding:10px;border-radius:8px;overflow-x:auto}
.src{font-size:11.5px;color:var(--ink3);margin:-4px 0 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}summary::-webkit-details-marker{display:none}
summary .id{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12px;min-width:34px}
.stages{display:flex;gap:4px;margin:8px 0 12px;flex-wrap:wrap}
.stages span{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--ink3)}
.stages span.past{background:var(--acc-soft);color:var(--acc)}.stages span.now{background:var(--acc);color:#fff}
.ms{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.ms .mid{font-weight:750;font-size:18px;color:var(--ink3)}.ms.active .mid{color:var(--acc)}.ms.done .mid{color:var(--ok)}
.check{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:2px 0}
.check b{flex:none;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line2);margin-top:3px;display:grid;place-items:center;font-size:10px}
.check.y b{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{color:var(--ink3);padding:20px;text-align:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;font-size:13px}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line2)}
.stat-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.err{background:var(--bad-soft);color:var(--bad);padding:12px;border-radius:8px}
@media (max-width:760px){
  .bar{padding:10px 16px 0}.meta{margin-left:0;width:100%}
  main{padding:16px 16px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(4,minmax(78vw,1fr))}
  .doclay{grid-template-columns:1fr}.toc{position:static;flex-direction:row;overflow-x:auto}.toc a{white-space:nowrap}
  .ms{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><i></i><span id="pname">프로젝트CD</span><span class="muted small" style="font-weight:500">PM</span></div>
    <div class="meta"><span id="stamp">불러오는 중…</span><button id="theme" type="button" aria-label="화면 밝기 바꾸기">밝기</button></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"><div class="empty">불러오는 중…</div></main>
<script>
(function(){
"use strict";
var B=null, VIEW={};
var TABS=[["overview","개요"],["kanban","칸반"],["milestones","마일스톤"],["orders","주문"],["resources","리소스"],["system","시스템"],["balance","밸런스"],["content","콘텐츠"],["decisions","결정"],["builds","빌드"],["log","기록"]];
var ST={todo:"할 일",doing:"진행 중",wait:"사용자 대기",done:"완료",active:"진행 중"};
var TEAM={"대표":"대표","사용자":"사용자",planning:"기획",core:"Core",client:"클라이언트",art:"아트",qa:"QA",member:"팀원"};
var RACE={human:"인간",elf:"엘프",dwarf:"드워프",beast:"수인",spirit:"정령",dragon:"용족"};
var ART_ST={planned:["계획","c-todo"],draft:["시안","c-wait"],confirmed:["확정본","c-acc"],ingame:["게임 반입","c-done"],temp:["임시 그림","c-todo"],final:["본 그림","c-done"],none:["없음","c-bad"]};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function chip(st,label){var c={done:"c-done",doing:"c-doing",wait:"c-wait",todo:"c-todo",active:"c-doing"}[st]||"c-todo";return '<span class="chip '+c+'">'+esc(label||ST[st]||st)+'</span>'}
function team(t){return TEAM[t]||t}
function src(o){if(!o)return"";return '<div class="src"><span>'+esc(o.at||"")+'</span><span class="chip">'+esc(lane(o.branch))+'</span>'+(o.dirty?'<span class="chip c-wait">미커밋 작업 반영</span>':'')+'</div>'}
function lane(br){var t=(B.trees||[]).filter(function(x){return x.branch===br})[0];return t?t.lane+" 줄기":br}
function pct(a,b){return b?Math.round(a*100/b):0}
function $(s){return document.querySelector(s)}

/* ---------- 개요 ---------- */
function vOverview(){
  var ms=B.milestones||[], act=ms.filter(function(m){return m.status==="active"})[0]||ms[0]||{};
  var mt=act.tasks||[], md=mt.filter(function(t){return t.status==="done"}).length;
  var ex=act.exit||[], ed=ex.filter(function(e){return e.done}).length;
  var open=(B.orders||[]).filter(function(o){return !(o.closed||o.stage==="마감"||o.stage==="완료")});
  var ck=B.checks||{}, ckk=Object.keys(ck), ckok=ckk.filter(function(k){return ck[k].ok}).length;
  var pend=B.pending||[], pm=B.pm||{};
  var h='<h1>'+esc((B.project||{}).name||"프로젝트CD")+'</h1><p class="sub">'+esc((B.project||{}).summary||"")+'</p>';
  h+='<div class="grid kpis">';
  h+=kpi("현재 마일스톤",esc(act.id||"-"),esc(act.title||""),pct(md,mt.length));
  h+=kpi("마일스톤 업무",md+" / "+mt.length,"완료 기준 "+ed+" / "+ex.length,pct(md,mt.length));
  h+=kpi("열린 주문",open.length,open.map(function(o){return o.id}).join(" · "));
  h+=kpi("사용자 대기",pend.length,"결정·확인이 필요한 항목");
  h+=kpi("자동 검사",ckok+" / "+ckk.length,ckk.length&&ckok===ckk.length?"전부 통과":"실패 있음",null,ckk.length&&ckok!==ckk.length);
  h+='</div><div class="grid g2">';
  h+='<section class="card"><h2>작업 목표</h2><p style="margin-top:0">'+esc(pm.goal||act.goal||"")+'</p>';
  if(pm.focus&&pm.focus.length)h+='<h3>지금 집중</h3><ul class="plain">'+pm.focus.map(function(f){return'<li>'+esc(f)+'</li>'}).join("")+'</ul>';
  h+='</section>';
  h+='<section class="card"><h2>위험</h2>'+((pm.risks||[]).length?'<ul class="plain">'+pm.risks.map(function(r){return'<li class="risk-'+esc(r.level)+'">'+esc(r.text)+'</li>'}).join("")+'</ul>':'<div class="empty">없음</div>')+'</section>';
  h+='</div><h2 style="margin-top:22px">작업 줄기</h2><div class="grid g2">';
  (B.trees||[]).forEach(function(t){
    var live=t.lastEditTs&&(Date.parse(B.generatedAt.replace(" ","T"))/1000-t.lastEditTs)<1800;
    h+='<section class="card"><div class="row"><span class="dot'+(live?" live":"")+'"></span><h3 class="grow" style="margin:0">'+esc(t.lane)+' <span class="muted small">'+esc(t.branch)+'</span></h3>'+(live?'<span class="chip c-done">작업 중</span>':'<span class="chip">조용함</span>')+'</div>';
    h+='<p class="small muted" style="margin:6px 0 10px">'+esc(t.owns||"")+'</p>';
    h+='<div class="stat-chips"><span class="chip">미커밋 '+t.dirtyCount+'</span><span class="chip">오늘 커밋 '+t.today+'</span>'+(t.unpushed!=null?'<span class="chip '+(t.unpushed>10?"c-wait":"")+'">원격 미반영 '+t.unpushed+'</span>':'')+(t.lastEdit?'<span class="chip">마지막 수정 '+esc(t.lastEdit.slice(5))+'</span>':'')+'</div>';
    h+='<ul class="plain small">'+t.commits.slice(0,5).map(function(c){return'<li class="row"><code>'+esc(c.sha)+'</code><span class="grow">'+esc(c.msg)+'</span><span class="muted">'+esc(c.at.slice(5))+'</span></li>'}).join("")+'</ul>';
    if(t.dirty&&t.dirty.length)h+='<details><summary class="small muted">작업 중인 파일 '+t.dirtyCount+'개</summary><ul class="plain small">'+t.dirty.map(function(d){return'<li class="row"><span class="grow"><code>'+esc(d.file)+'</code></span><span class="muted">'+esc((d.at||"").slice(11))+'</span></li>'}).join("")+'</ul></details>';
    h+='</section>';
  });
  h+='</div><h2 style="margin-top:22px">사용자 대기</h2><section class="card">'+(pend.length?'<ul class="plain">'+pend.map(function(p){return'<li><div class="row"><span class="chip c-wait">'+esc(p.id)+'</span><span class="grow"><b style="font-weight:600">'+esc(p.q)+'</b></span><span class="muted small">'+esc(p.when||"")+'</span></div>'+(p.rec?'<div class="small muted" style="margin:3px 0 0 2px">'+esc(p.rec)+'</div>':'')+'</li>'}).join("")+'</ul>':'<div class="empty">없음</div>')+'</section>';
  return h;
}
function kpi(l,v,s,p,bad){return'<div class="card kpi"><div class="l">'+l+'</div><div class="v"'+(bad?' style="color:var(--bad)"':'')+'>'+v+'</div><div class="s">'+(s||"&nbsp;")+'</div>'+(p!=null?'<div class="prog"><i style="width:'+p+'%"></i></div>':'')+'</div>'}

/* ---------- 칸반 ---------- */
function cards(){
  var out=[];
  (B.milestones||[]).forEach(function(m){(m.tasks||[]).forEach(function(t){out.push({id:t.id,title:t.title,team:t.team,status:t.status,note:t.note||"",ms:m.id,from:"마일스톤 "+m.id,src:"ms"})})});
  (B.orders||[]).forEach(function(o){(o.tasks||[]).forEach(function(t){out.push({id:o.id+" "+t.id,title:t.title,team:t.team,status:t.status,note:t.why||"",ms:o.milestone,from:o.id,src:"order",order:o.id,branch:o.branch})})});
  return out;
}
function vKanban(){
  var f=VIEW.k||(VIEW.k={ms:"open",team:"",src:"",q:""});
  var all=cards(), mss=(B.milestones||[]);
  var openMs=mss.filter(function(m){return m.status!=="done"}).map(function(m){return m.id});
  var list=all.filter(function(c){
    if(f.ms==="open"){if(c.src==="ms"&&openMs.indexOf(c.ms)<0)return false;if(c.src==="order"){var o=B.orders.filter(function(x){return x.id===c.order})[0];if(o&&(o.closed||o.stage==="마감"||o.stage==="완료"))return false}}
    else if(f.ms&&c.ms!==f.ms)return false;
    if(f.team&&c.team!==f.team)return false;
    if(f.src&&c.src!==f.src)return false;
    if(f.q&&(c.title+" "+c.id+" "+c.note).toLowerCase().indexOf(f.q.toLowerCase())<0)return false;
    return true;
  });
  var teams=[];all.forEach(function(c){if(teams.indexOf(c.team)<0)teams.push(c.team)});
  var h='<h1>칸반</h1><p class="sub">마일스톤 업무와 주문별 팀 작업을 한 판에 모았다. 주문 작업의 상태는 보고서·커밋 근거나 PM 확인으로 정해진다.</p>';
  h+='<div class="filters"><select id="fms"><option value="open">열린 것만</option><option value="">전체</option>'+mss.map(function(m){return'<option value="'+esc(m.id)+'">'+esc(m.id+" "+m.title)+'</option>'}).join("")+'</select>';
  h+='<select id="fteam"><option value="">모든 팀</option>'+teams.map(function(t){return'<option value="'+esc(t)+'">'+esc(team(t))+'</option>'}).join("")+'</select>';
  h+='<select id="fsrc"><option value="">마일스톤+주문</option><option value="ms">마일스톤 업무</option><option value="order">주문 작업</option></select>';
  h+='<input id="fq" type="search" placeholder="검색" value="'+esc(f.q)+'"><span class="muted small">'+list.length+'건</span></div>';
  h+='<div class="kanban">';
  ["todo","doing","wait","done"].forEach(function(s){

  h+='<div class="grid g2">'+(b.length?b.map(function(x){return'<section class="card"><div class="row"><h2 class="grow" style="margin:0">'+esc(KIND[x.kind]||x.kind)+'</h2><span class="chip">'+esc(lane(x.branch))+'</span></div><div class="small muted" style="margin:6px 0 10px">빌드 '+esc(x.at)+' · '+esc(x.sizeMB)+'MB</div><div class="small">로컬 경로 <code>'+esc(x.local)+'</code></div><div style="margin-top:12px">'+(x.release?'<a class="btn" href="'+esc(x.release)+'" target="_blank" rel="noopener">내려받기</a> <span class="muted small">'+esc(x.tag)+'</span>':'<span class="chip c-wait">업로드 대기</span>')+'</div></section>'}).join(""):'<div class="card empty">빌드 없음</div>')+'</div>';
  h+='<h2 style="margin-top:22px">올린 빌드</h2><section class="card">'+(hs.length?tbl(["빌드 시각","종류","줄기","크기","받기"],hs.map(function(x){return[x.at,KIND[x.kind]||x.kind,lane(x.branch),x.sizeMB+"MB",H('<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.tag)+'</a>')]}),[3]):'<div class="empty">아직 없음</div>')+'<div style="margin-top:8px"><a class="btn ghost" href="'+esc(B.releasesUrl)+'" target="_blank" rel="noopener">Release 전체 보기</a></div></section>';
  return h;
}

/* ---------- 기록 ---------- */
function vLog(){
  var d=B.devlog||[];
  return'<h1>개발 기록</h1>'+d.map(function(x){return'<section class="card prose" style="margin-bottom:14px;max-width:none"><h2 style="border:0;margin-top:0;padding:0">'+esc(x.title)+'</h2>'+src(x)+x.html+'</section>'}).join("");
}

/* ---------- 틀 ---------- */
var VIEWS={overview:vOverview,kanban:vKanban,milestones:vMilestones,orders:vOrders,resources:vResources,system:function(){return vDocs("system","시스템")},balance:vBalance,content:vContent,decisions:vDecisions,builds:vBuilds,log:vLog};
function route(){var r=(location.hash||"#overview").slice(1);return VIEWS[r]?r:"overview"}
function render(){
  var r=route();
  var cnt={kanban:cards().filter(function(c){return c.status!=="done"}).length,decisions:(B.decisions||[]).length,orders:(B.orders||[]).filter(function(o){return!(o.closed||o.stage==="마감"||o.stage==="완료")}).length};
  $("#tabs").innerHTML=TABS.map(function(t){return'<a href="#'+t[0]+'" class="'+(t[0]===r?"on":"")+'">'+t[1]+(cnt[t[0]]?'<span class="n">'+cnt[t[0]]+'</span>':'')+'</a>'}).join("");
  try{$("#app").innerHTML=VIEWS[r]()}catch(e){$("#app").innerHTML='<div class="err">화면을 그리지 못했다: '+esc(e.message)+'</div>';console.error(e)}
  if(r==="kanban")bindKanban();if(r==="system")bindDocs("system");if(r==="content")bindDocs("content");if(r==="balance")bindBalance();
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
var th=null;try{th=localStorage.getItem("cdpm-theme")}catch(e){}
if(th)document.documentElement.setAttribute("data-theme",th);
$("#theme").onclick=function(){var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var n=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("cdpm-theme",n)}catch(e){}};
fetch("data/board.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
  B=d;$("#pname").textContent=(d.project&&d.project.name)||"프로젝트CD";
  $("#stamp").textContent="갱신 "+d.generatedAt+" · 마지막 작업 "+(d.sourceAt||"-");
  render();
}).catch(function(e){$("#app").innerHTML='<div class="err">데이터를 불러오지 못했다: '+esc(e.message)+'</div>'});
})();
</script>
