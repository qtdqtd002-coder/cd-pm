<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포트메이츠 PM</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f4f1;--panel:#fff;--sunk:#efede8;--line:#e3e0d9;--line2:#d2cec5;
  --ink:#1c1b19;--ink2:#56524b;--ink3:#8b867c;
  --acc:#2f5bd3;--acc-soft:#e7edfb;
  --ok:#1d8656;--ok-soft:#e1f2e9;--warn:#a96d12;--warn-soft:#fbefd8;--bad:#c0392f;--bad-soft:#fbe4e1;--doing:#6a48cf;--doing-soft:#eee8fb;
  --r:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131312;--panel:#1c1b1a;--sunk:#242321;--line:#2e2c29;--line2:#3b3935;
  --ink:#eeebe5;--ink2:#b2ada3;--ink3:#7e7970;
  --acc:#7d9cf5;--acc-soft:#222b45;
  --ok:#5cc596;--ok-soft:#19312a;--warn:#e0a84c;--warn-soft:#352a16;--bad:#ef7d75;--bad-soft:#3b201f;--doing:#a991f2;--doing-soft:#2a2340;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131312;--panel:#1c1b1a;--sunk:#242321;--line:#2e2c29;--line2:#3b3935;
  --ink:#eeebe5;--ink2:#b2ada3;--ink3:#7e7970;
  --acc:#7d9cf5;--acc-soft:#222b45;
  --ok:#5cc596;--ok-soft:#19312a;--warn:#e0a84c;--warn-soft:#352a16;--bad:#ef7d75;--bad-soft:#3b201f;--doing:#a991f2;--doing-soft:#2a2340;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-feature-settings:"tnum"}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--sunk);padding:1px 5px;border-radius:4px;word-break:break-all}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:750;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--acc)}
.meta{margin-left:auto;color:var(--ink3);font-size:12px;display:flex;gap:10px;align-items:center}
.meta button{border:1px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:7px;padding:2px 8px;font:inherit;cursor:pointer}
nav.tabs{max-width:1180px;margin:0 auto;padding:4px 14px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 10px 8px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:550;font-size:13.5px}
nav.tabs a:hover{color:var(--ink);text-decoration:none}nav.tabs a.on{color:var(--ink);border-color:var(--acc)}
nav.tabs a .n{font-size:11px;color:var(--ink3);margin-left:3px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 64px}
h1{font-size:21px;margin:0;letter-spacing:-.02em}
.eyebrow{font-size:12px;color:var(--ink3);margin-bottom:2px}
.sec{margin-top:26px}
.sec>h2{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.sec>h2 .no{color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums}
.sec>h2 .aside{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.headline{margin:12px 0 0;padding:14px 16px 14px 34px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r)}
.headline li{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.stat{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat .l{font-size:12px;color:var(--ink3)}.stat .v{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.35}.stat .s{font-size:12px;color:var(--ink2)}
.bar-s{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;min-width:60px}.bar-s>i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap;line-height:1.75}
.c-done{background:var(--ok-soft);color:var(--ok)}.c-doing{background:var(--doing-soft);color:var(--doing)}.c-wait{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-acc{background:var(--acc-soft);color:var(--acc)}
.muted{color:var(--ink3)}.small{font-size:12.5px}.nowrap{white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
tr:last-child>td{border-bottom:0}
th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--sunk);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.risk{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.risk:first-child{border-top:0;padding-top:0}
.lv{flex:none;width:34px;font-size:11.5px;font-weight:700;text-align:center;border-radius:5px;line-height:20px;height:20px}
.lv.high{background:var(--bad-soft);color:var(--bad)}.lv.mid{background:var(--warn-soft);color:var(--warn)}.lv.low{background:var(--sunk);color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--line2);margin-right:6px;vertical-align:1px}.dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.hbar{display:grid;grid-template-columns:90px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.hbar .t{height:8px;background:var(--sunk);border-radius:9px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--acc)}
ul.dots{margin:0;padding-left:18px}ul.dots li{margin:3px 0}
/* 접기 */
details.row{border-bottom:1px solid var(--line)}details.row:last-child{border-bottom:0}
details.row>summary{list-style:none;cursor:pointer;display:grid;gap:10px;align-items:center;padding:9px 14px}
details.row>summary::-webkit-details-marker{display:none}
details.row>summary:hover{background:var(--sunk)}
details.row[open]>summary{background:var(--sunk)}
details.row .body{padding:10px 14px 14px}
.caret{width:14px;color:var(--ink3);transition:transform .15s}details[open]>summary .caret{transform:rotate(90deg)}
.g-ms{grid-template-columns:14px 44px 1fr 90px 120px}
.g-or{grid-template-columns:14px 70px 1fr 64px 120px}
.g-dc{grid-template-columns:14px 44px 1fr 86px}
.g-gr{grid-template-columns:14px 1fr auto}
.check{display:flex;gap:7px;font-size:13px;padding:1px 0}
.check b{flex:none;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line2);margin-top:4px;display:grid;place-items:center;font-size:9px}
.check.y b{background:var(--ok);border-color:var(--ok);color:#fff}
/* 칸반 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:8px}
.col h3{display:flex;justify-content:space-between;font-size:13px;margin:2px 4px 8px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.k .t{font-size:13px;font-weight:550;line-height:1.45}
.k .m{font-size:11.5px;color:var(--ink3);margin-top:3px}
.k .w{font-size:11.5px;color:var(--ink2);margin-top:3px;border-top:1px dashed var(--line);padding-top:3px}
.more{width:100%;font:inherit;font-size:12.5px;padding:6px;border:1px dashed var(--line2);background:none;border-radius:8px;color:var(--ink2);cursor:pointer}
/* 문서 */
.prose{font-size:13.5px}
.prose h2,.prose h3,.prose h4{font-size:13.5px;margin:12px 0 4px}
.prose p{margin:6px 0}.prose ul,.prose ol{padding-left:20px;margin:4px 0}
.prose blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--line2);color:var(--ink2)}
.prose table{margin:6px 0}
.prose pre{background:var(--sunk);padding:8px;border-radius:8px;overflow-x:auto}
.summary{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);padding:12px 16px}
.summary .h{font-size:12px;color:var(--ink3);margin-bottom:4px}
.src{font-size:11.5px;color:var(--ink3)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs2 a{font-size:12.5px;padding:3px 10px;border:1px solid var(--line2);border-radius:99px;color:var(--ink2)}
.tabs2 a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tabs2 a:hover{text-decoration:none}
.btn{display:inline-flex;align-items:center;padding:5px 12px;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;font-size:13px}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
.empty{color:var(--ink3);padding:14px;text-align:center;font-size:13px}
.err{background:var(--bad-soft);color:var(--bad);padding:12px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* 원화 잠금 갤러리 */
.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;flex:1 1 220px;max-width:320px}
.lock button{border:0;cursor:pointer;font:inherit;font-size:13px}
.lock button.ghost{background:none;color:var(--ink2);border:1px solid var(--line2);font-weight:550}
.lock .msg{font-size:12.5px;color:var(--ink3)}.lock .msg.bad{color:var(--bad)}.lock .grow{flex:1;min-width:0}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:7px;background:var(--sunk);display:block;cursor:zoom-in;border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;font-size:11px;color:var(--ink3);cursor:default}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:6px}
.lb .cap{color:#eee;font-size:13px;margin-top:10px;text-align:center}
/* 주문: 4단계 · 신규 주문 추가 */
.h1row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.h1row .btn{margin-left:auto}
button.btn{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
button.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line2);font-weight:550}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.flow a{display:block;padding:11px 14px;border-right:1px solid var(--line);color:var(--ink);position:relative}
.flow a:last-child{border-right:0}.flow a:hover{background:var(--sunk);text-decoration:none}
.flow a.on{background:var(--sunk);box-shadow:inset 0 -2px 0 var(--acc)}
.flow .l{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}.flow .v{font-size:20px;font-weight:700;line-height:1.35}.flow .s{font-size:11.5px;color:var(--ink2)}
.flow .sw{width:8px;height:8px;border-radius:3px;display:inline-block}
.sw.new{background:var(--acc)}.sw.doing{background:var(--doing)}.sw.done{background:var(--warn)}.sw.built{background:var(--ok)}
.oform{display:grid;gap:12px}
.oform label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.oform label .hint{font-weight:400;color:var(--ink3)}
.oform input[type=text],.oform textarea,.oform select{font:inherit;font-size:13.5px;font-weight:400;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);width:100%}
.oform textarea{resize:vertical;min-height:76px;line-height:1.55}
.imp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imp label{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-weight:400;position:relative}
.imp input{position:absolute;opacity:0;pointer-events:none}
.imp b{font-size:13.5px;color:var(--ink)}.imp span{font-size:11.5px;color:var(--ink3);line-height:1.4}
.imp label:has(input:checked){border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.imp label.high:has(input:checked){border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.imp label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.oform .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oform .msg{font-size:12.5px;color:var(--ink3)}.oform .msg.bad{color:var(--bad)}.oform .msg.ok{color:var(--ok)}
.req{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
/* 도식: 서비스 구조 · 작업 프로세스 (2026-11-22) */
:root{--who-user:#b8457a;--who-user-soft:#f8e3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--who-user:#e98bb5;--who-user-soft:#3a2230}}
:root[data-theme="dark"]{--who-user:#e98bb5;--who-user-soft:#3a2230}
.w-user{--a:var(--who-user);--as:var(--who-user-soft)}.w-pm{--a:var(--acc);--as:var(--acc-soft)}.w-work{--a:var(--doing);--as:var(--doing-soft)}.w-tool{--a:var(--ink3);--as:var(--sunk)}
.arw{display:grid;place-items:center;color:var(--ink3);min-width:0}
.arw svg{width:18px;height:18px;display:block}
.dg-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:10px 2px 0}
.dg-legend span{display:inline-flex;align-items:center;gap:6px}
.dg-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--a)}
.dg-legend .chip{margin-right:-2px}
/* 작업 프로세스: 네 단계 열 */
.phases{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);align-items:stretch}
.ph{background:var(--sunk);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph h3{margin:2px 4px 2px;font-size:13px;display:flex;align-items:baseline;gap:6px}
.ph h3 .kk{font-size:11px;color:var(--ink3);font-weight:600}
.ph h3 a{margin-left:auto;font-size:12px;font-weight:600}
.step{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:8px;padding:7px 9px;font-size:12.5px;line-height:1.5}
.step .who{display:inline-block;font-size:11px;font-weight:700;color:var(--a);background:var(--as);border-radius:5px;padding:0 5px;margin-right:5px;line-height:1.6}
.step .no{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-right:3px}
.step code,.dbox code,.fs code,.sub code,.svc code{word-break:normal;overflow-wrap:break-word}
.step.back{border-color:var(--bad);border-style:dashed;border-left-style:solid;border-left-color:var(--bad)}
.step.back .who{color:var(--bad);background:var(--bad-soft)}
.loopbk{grid-column:3/6;grid-row:2;margin:0 18% 0;height:26px;border:1.5px dashed var(--bad);border-top:0;border-radius:0 0 12px 12px;position:relative}
.loopbk::before{content:"";position:absolute;left:-6.5px;top:-6px;border-left:5.5px solid transparent;border-right:5.5px solid transparent;border-bottom:8px solid var(--bad)}
.loopbk span{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:var(--bg);padding:0 8px;font-size:11.5px;color:var(--bad);white-space:nowrap;font-weight:600}
.stg{display:flex;align-items:center;flex-wrap:wrap;gap:4px 2px}
.stg .s{padding:3px 10px;border-radius:99px;font-weight:650;font-size:12.5px;background:var(--sunk);color:var(--ink)}
.stg .g{font-size:11px;color:var(--ink3);display:inline-flex;align-items:center;gap:1px;padding:0 2px}
.stg .g svg{width:14px;height:14px}
.stg .ph-l{font-size:11px;color:var(--ink3);width:100%;margin-top:2px}
.routes{display:grid;gap:8px}
.route{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.route:first-child{border-top:0;padding-top:0}
.route .rn{font-weight:700;font-size:13px}.route .rn span{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.gate{display:inline-flex;align-items:center;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);white-space:nowrap}
.msgs{display:grid;gap:0}
.msg-r{display:grid;grid-template-columns:minmax(0,250px) minmax(0,170px) minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.msg-r:last-child{border-bottom:0}
.msg-r code{font-size:12px;word-break:normal;overflow-wrap:break-word;justify-self:start}
.fromto{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
span.who{font-size:11px;font-weight:700;color:var(--a);background:var(--as);border-radius:5px;padding:0 6px;line-height:1.7}
.fromto svg{width:14px;height:14px;color:var(--ink3)}
/* 조직 */
.org{display:grid;gap:8px;justify-items:center}
.org .nd{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--a);border-radius:8px;padding:6px 12px;text-align:center;font-size:12.5px;min-width:0}
.org .nd b{display:block;font-size:13px}.org .nd span{color:var(--ink3);font-size:11.5px}
.org .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.org .vl{width:2px;height:12px;background:var(--line2)}
/* 서비스 구조 */
.rt{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1.35fr);align-items:center}
.rt-l{display:grid;gap:10px}
.dbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.dbox .bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 2px 8px}
.dbox .bh b{font-size:13.5px}.dbox .bh span{font-size:11.5px;color:var(--ink3)}
.dbox.plan{border-style:dashed;background:transparent}
.lyr{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;padding:6px 9px;border-radius:7px;background:var(--sunk);margin-top:4px;font-size:12.5px;align-items:baseline}
.lyr b{font-size:12.5px}.lyr span{color:var(--ink2)}
.lyr.core{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.dbox .note{font-size:11.5px;color:var(--ink3);margin:8px 2px 0}
.mini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:6px;align-items:center}
.mini .mn{border:1px solid var(--line2);border-radius:7px;padding:6px;text-align:center;font-size:12px}
.mini .mn b{display:block;font-size:12.5px}.mini .mn span{color:var(--ink3)}
.mini .mx{display:grid;gap:1px;text-align:center;font-size:11.5px;color:var(--ink2)}

function vMilestones(){

/* ===== 리소스 ===== */
/* 원화는 공개 저장소에 암호화(AES-256-GCM)된 축소본(data/art/*.bin)만 있다. 암호 → PBKDF2 → 키, 키는 이 탭 메모리(+세션 저장소)에만 둔다. */
var GAL={key:null,url:{},busy:{},q:[],run:0,msg:"",bad:false};
function u8(b64){var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function galDecrypt(key,buf){var a=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12))}
function galUnlock(pw){
  var g=B.art.gallery;
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u8(g.salt),iterations:g.iter},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }).then(function(key){return galDecrypt(key,u8(g.check).buffer).then(function(){return key})});
}
function galRemember(key){crypto.subtle.exportKey("raw",key).then(function(raw){try{sessionStorage.setItem("cdpm-art-"+B.art.gallery.salt,btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}})}
function galRestore(){
  var g=B.art&&B.art.gallery;if(!g||GAL.key||!window.crypto||!crypto.subtle)return Promise.resolve();
  var s=null;try{s=sessionStorage.getItem("cdpm-art-"+g.salt)}catch(e){}
  if(!s)return Promise.resolve();
  return crypto.subtle.importKey("raw",u8(s),{name:"AES-GCM"},true,["decrypt"]).then(function(key){return galDecrypt(key,u8(g.check).buffer).then(function(){GAL.key=key})}).catch(function(){try{sessionStorage.removeItem("cdpm-art-"+g.salt)}catch(e){}});
}
function galLoad(id){var f=B.art.gallery.files[id];if(!f||GAL.url[id]||GAL.busy[id])return;GAL.busy[id]=1;GAL.q.push(id);galPump()}
function galPump(){
  while(GAL.run<4&&GAL.q.length){
    (function(id){
      GAL.run++;var f=B.art.gallery.files[id];
      fetch(f.f).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer()}).then(function(buf){return galDecrypt(GAL.key,buf)}).then(function(plain){
        GAL.url[id]=URL.createObjectURL(new Blob([plain],{type:"image/webp"}));
        document.querySelectorAll('[data-art="'+CSS.escape(id)+'"]').forEach(galPaint);
      }).catch(function(e){console.error("원화",id,e);document.querySelectorAll('[data-art="'+CSS.escape(id)+'"]').forEach(function(el){el.textContent="실패"})}).then(function(){GAL.run--;delete GAL.busy[id];galPump()});
    })(GAL.q.shift());
  }
}
function galPaint(el){var id=el.getAttribute("data-art");if(!GAL.url[id])return;var im=document.createElement("img");im.className="thumb";im.alt=el.getAttribute("data-title")||id;im.src=GAL.url[id];im.setAttribute("data-zoom",id);el.replaceWith(im)}

  return'<span class="thumb ph" data-art="'+esc(i.id)+'" data-title="'+esc(i.title)+'">…</span>';
}
function galCard(){
  var g=B.art.gallery,n=Object.keys(g.files).length;
  if(!window.crypto||!crypto.subtle)return'<div class="err">이 브라우저(또는 http 주소)에서는 암호 해제를 쓸 수 없어요. https 주소로 열어 주세요.</div>';
  if(GAL.key)return'<div class="card"><div class="lock"><span class="chip c-done">원화 열림</span><span class="small muted grow">'+n+'장 · 축소본(긴 변 1280px) · 묶음을 펼치고 그림을 누르면 크게 봐요</span><button type="button" class="btn ghost" id="galLock">다시 잠그기</button></div></div>';
  return'<div class="card"><p class="small muted" style="margin:0 0 10px">원화 '+n+'장은 암호화되어 있어요. 암호를 넣으면 이 브라우저 안에서만 풀려요.</p><form class="lock" id="galForm" autocomplete="off"><input type="password" id="galPw" placeholder="갤러리 암호" aria-label="갤러리 암호" autocomplete="current-password"><button type="submit" class="btn" id="galGo">열기</button><span class="msg'+(GAL.bad?" bad":"")+'" id="galMsg">'+esc(GAL.msg)+'</span></form></div>';
}
function bindResources(){
  var g=B.art&&B.art.gallery;if(!g)return;

    e.preventDefault();var pw=$("#galPw").value;if(!pw)return;
    $("#galGo").disabled=true;$("#galMsg").className="msg";$("#galMsg").textContent="확인하는 중…";
    galUnlock(pw).then(function(key){GAL.key=key;GAL.msg="";GAL.bad=false;galRemember(key);render()}).catch(function(){GAL.msg="암호가 맞지 않아요.";GAL.bad=true;render();var p=$("#galPw");if(p)p.focus()});

    step("↺","work","QA 에서 나온 문제는 그 세션으로 — stage <code>제작</code> 으로 고치고 다시 <code>마감</code>",true)]);
  var p4=col("4","빌드 완료",c.built,[
    step(14,"pm","버전 다섯 값 올림 → 빌드·배포 → 커밋 <code>앱 X.Y.Z · versionCode N (CD-…)</code> + 태그"),
    step(15,"tool","Firebase 가 테스터 폰에 새 빌드 · <code>close-built</code> 로 접수 닫기 · 푸시는 승인 뒤"),
    step(16,"user","폰에서 해 본다 → 고칠 것은 새 접수로"),
    step(17,"pm","정리: main 에 들어간 worktree 삭제(브랜치는 남김) · 배포 뒤 세션 삭제")]);
  h+=sec("1","주문 한 건이 가는 길",'<div class="phases">'+p1+ARW+p2+ARW+p3+ARW+p4+'<div class="loopbk"><span>빌드 QA 문제 → 되돌림</span></div></div>'+legend(["user","pm","work","intake","tool"]),"숫자 = 지금 그 단계의 주문");
  /* 2. stage 와 게이트 */
  var G=function(g){return'<span class="g">'+ASVG+(g?'<span>'+g+'</span>':'')+'</span>'};
  h+=sec("2","주문 단계(stage)와 게이트",'<div class="grid2"><div class="card">'+
    '<div class="small muted" style="margin-bottom:8px"><code>00-order.md</code> 의 <code>- stage:</code> 줄엔 이 다섯 단어만 쓴다. 다른 말을 쓰면 사이트가 «신규 주문» 으로 읽는다.</div>'+
    '<div class="stg"><span class="s">접수</span>'+G("spec")+'<span class="s">제작</span>'+G("impl")+'<span class="s">검수</span>'+G("qa")+'<span class="s">마감</span>'+G("close")+'<span class="s">완료</span></div>'+
    '<div class="tw" style="margin-top:12px"><table><thead><tr><th>사이트 단계</th><th>stage</th></tr></thead><tbody>'+
    '<tr><td>'+phChip("new")+'</td><td>접수 · 또는 이어진 주문이 없는 접수</td></tr>'+
    '<tr><td>'+phChip("doing")+'</td><td>제작 · 검수</td></tr>'+
    '<tr><td>'+phChip("done")+'</td><td>마감 · 완료 — 아직 버전 커밋에 안 들어감</td></tr>'+
    '<tr><td>'+phChip("built")+'</td><td>버전 커밋 <code>앱 X.Y.Z · versionCode N (CD-…)</code> 에 들어감</td></tr>'+
    '</tbody></table></div></div>'+
    '<div class="card"><div class="small muted" style="margin-bottom:8px">경로는 일의 크기로 고른다. 게이트는 <code>studio.py gate CD-NNNN spec|impl|qa|close</code> 가 파일을 검사한다.</div><div class="routes">'+
    '<div class="route"><div class="rn">direct<span>직행</span></div><div><div class="stg"><span class="gate">00-order.md 한 장</span>'+G("")+'<span class="gate">close</span></div><div class="small muted" style="margin-top:3px">한 팀 파일만 · 규칙·데이터 구조·저장·네트워크 안 바뀜 · 방향 잠금 밖 · 에이전트 한 번</div></div></div>'+
    '<div class="route"><div class="rn">fast<span>한 팀</span></div><div><div class="stg"><span class="gate">spec</span>'+G("")+'<span class="gate">impl</span>'+G("")+'<span class="gate">qa</span>'+G("")+'<span class="gate">close</span></div><div class="small muted" style="margin-top:3px">짧은 기획서 → 팀장 하나 → QA팀장</div></div></div>'+
    '<div class="route"><div class="rn">full<span>여러 팀</span></div><div><div class="stg"><span class="gate">spec</span>'+G("")+'<span class="gate">impl</span>'+G("")+'<span class="gate">qa</span>'+G("")+'<span class="gate">close</span></div><div class="small muted" style="margin-top:3px">기획팀장 → 팀장들 → QA팀장 · 규칙이 바뀌는 일</div></div></div>'+
    '</div><div class="small muted" style="margin-top:8px">크기: «팀별 작업» 한 줄 = 에이전트 한 번(60턴) · 한 주문에 한 팀 줄은 2개까지 · 기획서 15,000자 — 넘으면 주문을 나눈다.</div></div></div>');
  /* 3. 세션끼리 주고받는 말 */
  var M=[["접수 #N &lt;제목&gt;","intake","pm","새 일이 들어왔다 — 관제가 분석·번호"],
    ["차례 CD-NNNN","pm","work","이 세션이 그 주문의 작업 세션이 된다"],
    ["Unity 시작 &lt;줄기&gt; / Unity 끝 &lt;줄기&gt;","work","pm","Unity 는 PC 전체에서 하나 — 관제가 차례를 준다"],
    ["빌드 대기 &lt;줄기&gt; &lt;해시&gt;","work","pm","개발 끝 · 병합과 빌드 QA 를 기다림"],
    ["되돌림 (QA 문제)","pm","work","빌드 QA 에서 나온 것을 고친다"]];
  h+=sec("3","세션끼리 주고받는 말",'<div class="card flush">'+M.map(function(m){return'<div class="msg-r"><code>'+m[0]+'</code><span class="fromto">'+whoTag(m[1])+ASVG+whoTag(m[2])+'</span><span class="muted">'+m[3]+'</span></div>'}).join("")+'</div>','세션 이름 앞 [CD-NNNN][대기]·[작업 중]·[선택 필요]·[작업 완료] 는 관제가 붙인다');
  /* 4. 검사는 누가 언제 */
  h+=sec("4","검사는 누가 언제",'<div class="card flush">'+tbl(["언제","누가","무엇을"],[
    [H('<b>개발 중</b>'),H(whoTag("work")),H('바꾼 곳 시험만 — <code>dotnet test --filter</code> · <code>unity test … --filter</code>')],
    [H('<b>빌드 대기로 넘길 때</b>'),H(whoTag("work")),H('<code>studio.py check</code>(Unity 없이) + 바꾼 곳 EditMode 필터 한 번. PlayMode 는 꼭 필요할 때 한두 개만')],
    [H('<b>병합 뒤</b>'),H(whoTag("pm")),H('main 에서 <code>check --unity</code> 전체 한 번')],
    [H('<b>빌드 때</b>'),H(whoTag("pm")),H('빌드 대기 묶음 전체: PlayMode 전체 · QA · 캡처 검수 · 해 볼 것 목록 → 문제는 그 세션으로')],
    [H('<b>빌드 뒤</b>'),H(whoTag("user")),H('폰에서 사람 플레이')]])+'</div>');
  /* 5. 조직 */
  h+=sec("5","작업 세션 안의 팀",'<div class="card"><div class="org">'+
    '<div class="nd w-user"><b>사용자</b><span>방향·확인·승인</span></div><div class="vl"></div>'+
    '<div class="row"><div class="nd w-pm"><b>관제</b><span>접수·번호·병합·빌드·기록</span></div><div class="nd w-work"><b>작업 세션 = 대표</b><span>주문을 팀에 나눔 · 직접 구현 안 함</span></div></div><div class="vl"></div>'+
    '<div class="row">'+[["기획팀장","규칙·수치·기획서"],["Core팀장","규칙 엔진·판정"],["클라팀장","화면·UI·빌드"],["아트팀장","그림·소리·장부"],["QA팀장","독립 검증"]].map(function(x){return'<div class="nd w-work"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div><div class="vl"></div>'+
    '<div class="row"><div class="nd w-tool"><b>팀원</b><span>팀장이 역할을 적어 주고 부름</span></div><div class="nd w-tool"><b>Codex</b><span>그림 · 리뷰 1회 · 질문</span></div></div>'+
    '</div><div class="small muted" style="margin-top:10px;text-align:center">한 파일은 한 팀만 고친다 · 모델은 일의 성격으로(기본 Sonnet, 설계·원인 모를 버그는 Opus) · 에이전트 한 번 60턴 안</div></div>');
  /* 6. 지킬 것 */
  h+=sec("6","지킬 것",'<div class="card"><ul class="dots">'+
    '<li><b>Unity 는 PC 전체에서 한 번에 하나</b> — RAM 16GB 에서 여럿이 겹쳐 PC 가 멈춘 적이 있다. 빌드·업로드 스크립트도 Unity 를 띄운다.</li>'+
    '<li><b>기록 분담</b> — 작업 세션은 주문 폴더 안(진행·보고서·<code>90-close.md</code>)까지. devlog · 마일스톤 · <code>checks.json</code> · 사이트는 관제가 main 에서 묶음마다.</li>'+
    '<li><b>번호·병합 순서는 관제가 준다</b> — 세션이 «다음 빈 번호» 를 스스로 잡지 않는다.</li>'+
    '<li><b>커밋은 경로를 지정해서, 푸시는 사용자 승인 뒤.</b> 비용 드는 일(크레딧·유료 API)은 하지 않고 알린다.</li>'+
    '<li><b>디스크</b> — main 에 들어간 worktree 는 관제가 지운다(브랜치는 남김). 다시 고칠 일이 오면 같은 이름으로 다시 만들고 main 을 합친다.</li>'+
  '</ul></div>');
  return h;
}

var VIEWS={overview:vOverview,kanban:vKanban,milestones:vMilestones,orders:vOrders,decisions:vDecisions,resources:vResources,system:vSystem,balance:vBalance,economy:vEconomy,chapters:vChapters,content:vContent,builds:vBuilds,log:vLog,service:vService,process:vProcess};
function route(){var r=(location.hash||"#overview").slice(1);return VIEWS[r]?r:"overview"}
function render(){
  var r=route(),cnt={kanban:cards().filter(function(c){return c.status!=="done"&&(c.src==="ms"||c.open)}).length,orders:(B.orders||[]).filter(function(o){return phaseOf(o)!=="built"}).length+((B.intake||{}).requests||[]).filter(function(q){return q.state==="open"&&!(q.orders&&q.orders.length)}).length,decisions:(B.decisions||[]).filter(function(d){return d.kind!=="confirmed"}).length};
  $("#tabs").innerHTML=TABS.map(function(t){return'<a href="#'+t[0]+'" class="'+(t[0]===r?"on":"")+'">'+t[1]+(cnt[t[0]]?'<span class="n">'+cnt[t[0]]+'</span>':'')+'</a>'}).join("");
  try{$("#app").innerHTML=VIEWS[r]()}catch(e){$("#app").innerHTML='<div class="err">화면 오류: '+esc(e.message)+'</div>';console.error(e)}
  if(r==="kanban")bindKanban();if(r==="decisions")bindDecisions();if(r==="resources")bindResources();if(r==="orders")bindOrders();
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
var th=null;try{th=localStorage.getItem("cdpm-theme")}catch(e){}
if(th)document.documentElement.setAttribute("data-theme",th);
$("#theme").onclick=function(){var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("cdpm-theme",n)}catch(e){}};
fetch("data/board.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
  B=d;$("#pname").textContent=(d.project&&d.project.name)||"프로젝트CD";$("#stamp").textContent="갱신 "+d.generatedAt;galRestore().then(render);
}).catch(function(e){$("#app").innerHTML='<div class="err">데이터를 불러오지 못했다: '+esc(e.message)+'</div>'});
})();
</script>
